<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Propiedades</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fuente Inter para una mejor legibilidad */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Un color de fondo suave */
        }
        /* Estilos para el mensaje de confirmación/error */
        .message-box {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            font-weight: bold;
            display: none; /* Oculto por defecto */
        }
        .message-box.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message-box.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-200">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Encuentra tu Propiedad Ideal</h1>
        <p class="text-center text-gray-600 mb-8">
            Por favor, déjanos tus datos y una breve descripción de lo que buscas.
            Nos pondremos en contacto contigo a la brevedad.
        </p>

        <form id="propertyForm" class="space-y-6">
            <!-- Campo para el Nombre -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Tu nombre y apellido"
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                    required
                >
            </div>

            <!-- Campo para el Teléfono -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Ej: +XX XXX XXXX XXX"
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                    required
                >
            </div>

            <!-- Campo para el Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu.email@ejemplo.com"
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                    required
                >
            </div>

            <!-- Campo para la Descripción de lo que Busca -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
                    ¿Qué tipo de propiedad buscas? (Ej: Casa con 3 habitaciones, apartamento en el centro, terreno para construir)
                </label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Describe tu propiedad ideal..."
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                    required
                ></textarea>
            </div>

            <!-- Botón de Envío -->
            <button
                type="submit"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-500 transition duration-150 ease-in-out"
            >
                Enviar Solicitud por WhatsApp
            </button>
        </form>

        <!-- Contenedor para mensajes de confirmación/error -->
        <div id="messageBox" class="message-box"></div>
    </div>

    <script>
        // Obtener el formulario por su ID
        const form = document.getElementById('propertyForm');
        // Obtener el contenedor para mostrar mensajes
        const messageBox = document.getElementById('messageBox');

        // Función para mostrar mensajes al usuario
        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type}`; // Añade la clase de tipo (success o error)
            messageBox.style.display = 'block'; // Muestra el mensaje
            // Ocultar el mensaje después de 5 segundos
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }

        // Añadir un "event listener" para cuando se envíe el formulario
        form.addEventListener('submit', function(event) {
            // Prevenir el comportamiento por defecto del formulario (recargar la página)
            event.preventDefault();

            // Obtener los valores de los campos del formulario
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const description = document.getElementById('description').value;

            // Validar que los campos requeridos no estén vacíos
            if (!name || !phone || !email || !description) {
                showMessage('Por favor, completa todos los campos requeridos.', 'error');
                return; // Detener la ejecución si hay campos vacíos
            }

            // Define tu número de WhatsApp (incluye el código de país, sin el signo +)
            // Tu número de WhatsApp: 54143200949
            const yourWhatsAppNumber = '54143200949'; // <-- ¡Tu número de WhatsApp ha sido actualizado aquí!

            // Construir el mensaje para WhatsApp
            const message = `¡Hola! Tengo un nuevo cliente potencial de tu sitio web de bienes raíces:\n\n` +
                            `Nombre: ${name}\n` +
                            `Teléfono: ${phone}\n` +
                            `Email: ${email}\n\n` +
                            `Descripción de lo que busca:\n${description}\n\n` +
                            `¡Contáctalo pronto!`;

            // Codificar el mensaje para que sea seguro en una URL
            const encodedMessage = encodeURIComponent(message);

            // Construir la URL de WhatsApp
            // Usamos 'wa.me' para abrir directamente la app o la versión web de WhatsApp
            const whatsappUrl = `https://wa.me/${yourWhatsAppNumber}?text=${encodedMessage}`;

            try {
                // Abrir WhatsApp en una nueva pestaña
                window.open(whatsappUrl, '_blank');
                showMessage('¡Mensaje enviado a WhatsApp! Nos pondremos en contacto contigo.', 'success');
                form.reset(); // Limpiar el formulario después del envío exitoso
            } catch (error) {
                console.error("Error al intentar abrir WhatsApp:", error);
                showMessage('No se pudo abrir WhatsApp. Por favor, inténtalo de nuevo.', 'error');
            }
        });
    </script>
</body>
</html>
